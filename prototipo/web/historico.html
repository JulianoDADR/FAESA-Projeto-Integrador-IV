<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Histórico · AgroAnálise</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="ativos/estilo.css">
  <script src="ativos/comum.js" defer></script>
</head>
<body>
<main class="max-w-4xl mx-auto px-4 py-6 space-y-5">
  <div>
    <h1 class="text-3xl font-extrabold">Histórico das últimas 24 horas</h1>
    <p class="mt-1">Leituras <b>simuladas</b> (uma por hora), cada uma classificada pelo modelo.</p>
  </div>
  <div id="erro" class="erro-caixa" hidden></div>
  <section class="cartao"><h2 class="font-bold mb-2">Umidade do solo (%) e classe de cada ponto</h2>
    <div id="grafico" class="overflow-x-auto"></div>
    <p class="text-sm mt-2">Cada ponto traz a cor e uma forma: círculo = Ideal, triângulo = Atenção, quadrado = Ação crítica.</p></section>
  <section class="cartao overflow-x-auto"><table class="tabela" id="tabela"></table></section>
</main>

<script>
const COR = { Verde: "#2E7D32", Amarelo: "#D98A1C", Vermelho: "#B3261E" };

function marca(x, y, classe) {
  const c = COR[classe];
  if (classe === "Verde") return `<circle cx="${x}" cy="${y}" r="6" fill="${c}"/>`;
  if (classe === "Amarelo") return `<polygon points="${x},${y - 7} ${x + 7},${y + 6} ${x - 7},${y + 6}" fill="${c}"/>`;
  return `<rect x="${x - 6}" y="${y - 6}" width="12" height="12" fill="${c}"/>`;
}

function grafico(pontos) {
  const L = 720, A = 260, m = { e: 40, d: 12, t: 12, b: 28 };
  const x = (i) => m.e + (i * (L - m.e - m.d)) / (pontos.length - 1);
  const y = (v) => m.t + (1 - v / 100) * (A - m.t - m.b);
  const grade = [0, 25, 50, 75, 100].map((v) => `<line x1="${m.e}" x2="${L - m.d}" y1="${y(v)}" y2="${y(v)}" stroke="#ddd"/><text x="${m.e - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#555">${v}</text>`).join("");
  const linha = pontos.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.umidade_solo)}`).join(" ");
  const horas = pontos.map((p, i) => (i % 4 === 0 ? `<text x="${x(i)}" y="${A - 8}" text-anchor="middle" font-size="11" fill="#555">${p.hora.slice(11, 16)}</text>` : "")).join("");
  const marcas = pontos.map((p, i) => marca(x(i), y(p.umidade_solo), p.classe)).join("");
  return `<svg viewBox="0 0 ${L} ${A}" style="min-width:560px;width:100%" role="img" aria-label="Gráfico de umidade do solo nas últimas 24 horas">${grade}<path d="${linha}" fill="none" stroke="#777" stroke-width="2"/>${marcas}${horas}</svg>`;
}

document.addEventListener("DOMContentLoaded", async () => {
  const r = await chamarApi("/historico");
  if (!r.ok) { const e = document.getElementById("erro"); e.hidden = false; e.textContent = r.erros[0]; return; }
  document.getElementById("grafico").innerHTML = grafico(r.dados);
  const icone = { Verde: "●", Amarelo: "▲", Vermelho: "■" };
  document.getElementById("tabela").innerHTML = "<thead><tr><th>Hora</th><th>Solo %</th><th>Temp. °C</th><th>Ar %</th><th>Classe</th></tr></thead><tbody>" +
    [...r.dados].reverse().map((p) => `<tr><td>${formatarHora(p.hora)}</td><td>${p.umidade_solo}</td><td>${p.temperatura}</td><td>${p.umidade_ar}</td>
      <td><span style="color:${COR[p.classe]}" aria-hidden="true">${icone[p.classe]}</span> <b>${p.rotulo}</b></td></tr>`).join("") + "</tbody>";
});
</script>
</body>
</html>
