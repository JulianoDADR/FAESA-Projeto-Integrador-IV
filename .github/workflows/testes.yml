# Testes automáticos a cada push e pull request. Sem segredos: o LLM é sempre simulado nos testes.
name: testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototipo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: prototipo/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Treinar o modelo (confere que o treino reproduz as métricas versionadas)
        run: python ml/treinar.py
      - name: Testes
        run: python -m pytest -v
      - name: Avaliação do LLM em modo mock (sem rede)
        run: python ml/avaliar_llm.py
